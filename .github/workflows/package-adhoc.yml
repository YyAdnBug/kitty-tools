name: package-adhoc

# 只在 fork 的工作分支上跑，借官方 GitHub-hosted 标签 xcode-27
#（历史 run 43394774095 证实：镜像 xcode-27-arm64 / macOS 27.0.1 / 默认 Xcode 27.1 / SDK macosx27.0）
# 打出未公证、临时 ad-hoc 签名的测试包。不发布 release，不改签名身份或 bundle id。
# 正式发布包仍走 macos/build-dmg.sh（Apple Development）。
on:
  push:
    branches: [fix/translate-tcp-fallback]

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 工具链
        run: |
          {
            sw_vers
            echo
            xcodebuild -version
            echo
            xcode-select -p
            echo
            xcodebuild -showsdks | grep -i macos || true
          } | tee "$RUNNER_TEMP/toolchain.txt"

      - name: 单测
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cd macos
          xcodebuild test -project KittyTools.xcodeproj -scheme KittyTools \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/KittyTools.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: 收集测试结果
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/KittyTools.xcresult" ]]; then
            ditto -c -k --keepParent "$RUNNER_TEMP/KittyTools.xcresult" "$RUNNER_TEMP/KittyTools.xcresult.zip"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/KittyTools.xcresult" \
              > "$RUNNER_TEMP/test-summary.txt" 2>/dev/null \
              || xcrun xcresulttool get --format json --path "$RUNNER_TEMP/KittyTools.xcresult" \
              > "$RUNNER_TEMP/test-summary.json" 2>/dev/null \
              || echo "xcresulttool 未能生成摘要" > "$RUNNER_TEMP/test-summary.txt"
          fi
          ls -la "$RUNNER_TEMP"/xcodebuild-test.log "$RUNNER_TEMP"/test-summary.* "$RUNNER_TEMP"/KittyTools.xcresult.zip 2>/dev/null || true

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/toolchain.txt
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/test-summary.txt
            ${{ runner.temp }}/test-summary.json
            ${{ runner.temp }}/KittyTools.xcresult.zip
          if-no-files-found: warn
          retention-days: 14

      - name: 编译 Release（不签名）
        run: |
          cd macos
          xcodebuild archive -project KittyTools.xcodeproj -scheme KittyTools \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/KittyTools.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: 临时签名并打 DMG / zip
        run: |
          set -euo pipefail
          APP=$(ls -d "$RUNNER_TEMP"/KittyTools.xcarchive/Products/Applications/*.app)
          NAME=$(basename "$APP" .app)
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo -n "archs="
            lipo -archs "$APP/Contents/MacOS/$NAME"
            echo "signing=ad-hoc"
            echo "notarized=no"
          } | tee "$RUNNER_TEMP/package-info.txt"

          python3 -c 'import os,pathlib; src=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"macos/Config/Finder.entitlements"; pathlib.Path(os.environ["RUNNER_TEMP"],"Finder-adhoc.entitlements").write_text(src.read_text().replace("$(APP_BUNDLE_ID)$(BUNDLE_ID_SUFFIX)","com.yy.kitty-tools.native"))'

          FX="$APP/Contents/PlugIns/KittyToolsFinder.appex"
          NP="$APP/Contents/XPCServices/KittyToolsNowPlaying.xpc"
          if [[ -d "$FX" ]]; then
            codesign --force --sign - --options runtime --entitlements "$RUNNER_TEMP/Finder-adhoc.entitlements" "$FX"
          fi
          if [[ -d "$NP" ]]; then
            codesign --force --sign - --options runtime "$NP"
          fi
          while IFS= read -r b; do
            codesign --force --sign - --options runtime "$b"
          done < <(find "$APP/Contents" \( -name "*.framework" -o -name "*.dylib" \) ! -path "*/PlugIns/*" ! -path "*/XPCServices/*")

          codesign --force --sign - --options runtime --entitlements "$GITHUB_WORKSPACE/macos/Config/KittyTools.entitlements" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          export STAGE
          python3 -c 'import pathlib,os; pathlib.Path(os.environ["STAGE"],"装之前先看.txt").write_text("""这是测试包：临时 ad-hoc 签名，没有 Apple 开发者签名，也没有公证。\n\n从浏览器下载的（DMG 或 zip）：装到 /Applications 之后，在终端跑一次\n  xattr -dr com.apple.quarantine \"/Applications/Kitty Tools.app\"\n或者右键 App → 打开 → 仍要打开。\n\n用 curl 下载的通常没有隔离标记，直接打开即可。\n\n临时签名的包每出一个都算「另一个 App」：屏幕录制、辅助功能这些权限\n可能要在 系统设置 › 隐私与安全性 里重新给一次。\n""")'

          DMG="$RUNNER_TEMP/${NAME}_${VERSION}_arm64.dmg"
          ZIP="$RUNNER_TEMP/${NAME}_${VERSION}_arm64.zip"
          hdiutil create -volname "$NAME" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$DMG" "$ZIP" | tee "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: adhoc-package-${{ github.sha }}
          path: |
            ${{ runner.temp }}/*.dmg
            ${{ runner.temp }}/*.zip
            ${{ runner.temp }}/package-info.txt
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/toolchain.txt
          if-no-files-found: error
          retention-days: 14
